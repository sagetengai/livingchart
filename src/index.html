<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tengai – Living Nautical Chart</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="appContainer">
    <svg id="mapLayer" class="layer"></svg>
    <canvas id="windCanvas" class="layer"></canvas>
    <div id="weatherPanel" class="overlay"></div>
    <select id="themeSelect" class="theme-selector">
      <option value="living">Living</option>
      <option value="classic">Classic</option>
      <option value="sculpted">Sculpted</option>
    </select>
  </div>
  <script type="module" src="app/init.js"></script>
</body>
</html>
